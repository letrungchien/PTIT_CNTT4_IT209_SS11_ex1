services:
  # ==================================================
  # DEPARTMENT DATABASE
  # ==================================================
  department-db:
    image: mysql:8.4
    container_name: department-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: 1234$
      MYSQL_DATABASE: department_db

    ports:
      - "3307:3306"

    volumes:
      - department_db_data:/var/lib/mysql
  # ==================================================
  # EMPLOYEE DATABASE
  # ==================================================
  employee-db:
    image: mysql:8.4
    container_name: employee-db
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: 1234$
      MYSQL_DATABASE: employee_db

    ports:
      - "3308:3306"

    volumes:
      - employee_db_data:/var/lib/mysql


  # ==================================================
  # VOLUMES
  # ==================================================
volumes:
    department_db_data:
    employee_db_data: